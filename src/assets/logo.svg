<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="شەپەق تېخنىكا سەھىپىسى">
  <defs>
    <linearGradient id="dawn" x1="40" y1="58" x2="40" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a3c"/>
      <stop offset=".45" stop-color="#f0b429"/>
      <stop offset="1" stop-color="#ffe7a3"/>
    </linearGradient>
    <linearGradient id="sky" x1="10" y1="70" x2="70" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16324a"/>
    </linearGradient>
    <radialGradient id="glow" cx="40" cy="46" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="80" height="80" rx="20" fill="url(#sky)"/>
  <circle cx="40" cy="46" r="26" fill="url(#glow)"/>

  <!-- rising sun = شەپەق -->
  <circle cx="40" cy="46" r="13" fill="url(#dawn)"/>
  <path d="M14 52h52" stroke="#1a2a3a" stroke-width="8" stroke-linecap="round"/>
  <path d="M18 50c7-1 14 2 22 2s15-3 22-2" stroke="#3dd6c6" stroke-width="2" stroke-linecap="round"/>

  <!-- circuit horizon = تېخنىكا -->
  <path d="M16 58h10l4-5 6 8 5-6 7 4h16" fill="none" stroke="#7cf0e4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="26" cy="58" r="1.7" fill="#7cf0e4"/>
  <circle cx="36" cy="61" r="1.7" fill="#7cf0e4"/>
  <circle cx="47" cy="55" r="1.7" fill="#7cf0e4"/>
  <circle cx="64" cy="58" r="1.7" fill="#7cf0e4"/>

  <!-- web mesh around sun = تور -->
  <circle cx="40" cy="46" r="20" fill="none" stroke="#9ad7ff" stroke-opacity=".35" stroke-width="1"/>
  <path d="M28 34l8 4 12-6M24 46h10M46 42l10 2M32 52l8-4 10 6" fill="none" stroke="#cfefff" stroke-opacity=".55" stroke-width="1.15"/>
  <circle cx="28" cy="34" r="2.1" fill="#e8f6ff"/>
  <circle cx="48" cy="32" r="2.1" fill="#e8f6ff"/>
  <circle cx="24" cy="46" r="2.1" fill="#e8f6ff"/>
  <circle cx="56" cy="44" r="2.1" fill="#e8f6ff"/>
  <circle cx="50" cy="54" r="2.1" fill="#e8f6ff"/>

  <!-- tiny uplink node -->
  <path d="M58 22v6M55 25h6" stroke="#f0d78c" stroke-width="1.6" stroke-linecap="round"/>
</svg>
